<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Switch</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <h1>Life Switch</h1>
    <p class="subtitle">Remote XM430 control</p>

    <div id="status-box" class="status-box">
      <div class="status-label">Status</div>
      <div id="state" class="state">—</div>
      <div id="position" class="position">Position: —</div>
    </div>

    <div class="buttons">
      <button id="btn-on" class="btn on">ON</button>
      <button id="btn-off" class="btn off">OFF</button>
      <button id="btn-toggle" class="btn toggle">TOGGLE</button>
      <button id="btn-status" class="btn status">STATUS</button>
    </div>

    <p id="message" class="message"></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
